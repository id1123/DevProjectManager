name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Git tag（例如 0.6alpha 或 v0.6.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 先拿到 Release ID，再交给 tauri-action 上传。不要把 tagName 直接传给
      # tauri-action，否则它生成的 latest.json 会使用 api.github.com 的 asset
      # 地址，客户端匿名下载很容易触发 GitHub API 速率限制并返回 403。
      - name: Create or reuse GitHub Release
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              return String(release.id);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `Project Hub ${tag}`,
              body: '请查看仓库中的 README 和更新说明。',
              draft: false,
              prerelease: false,
            });
            return String(release.id);

      - name: Build and publish NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # 不传 tagName 时，latest.json 会指向
          # /releases/latest/download/<asset>，避免客户端走 GitHub API asset 地址。
          releaseId: ${{ steps.release.outputs.result }}
          uploadUpdaterJson: true
          args: --bundles nsis
