name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 Git tag（例如 0.6alpha 或 v0.6.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish NSIS installer
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Project Hub ${{ env.RELEASE_TAG }}
          releaseBody: 请查看仓库中的 README 和更新说明。
          releaseDraft: false
          # GitHub 的 /releases/latest 下载地址会忽略 prerelease；保持为正式 Release，
          # 版本号中的 alpha/beta/rc 仍会由应用更新器按语义化版本处理。
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles nsis

      # tauri-action 生成的清单会使用 api.github.com/releases/assets/<id>。
      # 客户端匿名下载这个地址会受 GitHub API 速率限制，因此发布后
      # 将它改为公开 Release 资产的 browser_download_url。
      - name: Rewrite updater manifest download URLs
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId)) {
              throw new Error(`Invalid release ID: ${process.env.RELEASE_ID}`);
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId,
            });
            const manifestAsset = release.assets.find((asset) => asset.name === 'latest.json');
            if (!manifestAsset) throw new Error('latest.json was not uploaded');

            const response = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              {
                owner,
                repo,
                asset_id: manifestAsset.id,
                headers: { accept: 'application/octet-stream' },
              },
            );
            const manifestText = typeof response.data === 'string'
              ? response.data
              : Buffer.from(response.data).toString('utf8');
            const manifest = JSON.parse(manifestText);

            for (const [platform, entry] of Object.entries(manifest.platforms ?? {})) {
              const assetId = Number(new URL(entry.url).pathname.split('/').at(-1));
              const downloadAsset = release.assets.find((asset) => asset.id === assetId);
              if (!downloadAsset) {
                throw new Error(`Cannot map updater asset for ${platform}: ${entry.url}`);
              }
              entry.url = downloadAsset.browser_download_url;
            }

            const data = `${JSON.stringify(manifest, null, 2)}\n`;
            const replacementName = `latest.${context.runId}.${context.runAttempt}.json`;
            const { data: replacementAsset } = await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: releaseId,
              name: replacementName,
              headers: {
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(data),
              },
              data,
            });
            await github.rest.repos.deleteReleaseAsset({
              owner,
              repo,
              asset_id: manifestAsset.id,
            });
            await github.rest.repos.updateReleaseAsset({
              owner,
              repo,
              asset_id: replacementAsset.id,
              name: 'latest.json',
            });
